<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Python Project Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            background-color: #f8f9fa;
            color: #333;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #24292e;
            border-bottom: 2px solid #eaecef;
            padding-bottom: 10px;
        }
        p {
            color: #586069;
        }
        .file-list {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }
        .file-item {
            background: #f1f8ff;
            border: 1px solid #c8e1ff;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-name {
            font-weight: bold;
            color: #0366d6;
        }
        .btn-group a {
            display: inline-block;
            text-decoration: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 14px;
            margin-left: 5px;
            font-weight: 500;
        }
        .btn-view {
            background-color: #fafbfc;
            color: #24292e;
            border: 1px solid rgba(27,31,35,0.15);
        }
        .btn-view:hover { background-color: #f3f4f6; }
        .btn-colab {
            background-color: #f9ab00;
            color: white;
            border: 1px solid #f9ab00;
        }
        .btn-colab:hover { background-color: #e09a00; }
    </style>
</head>
<body>

<div class="container">
    <h1>🐍 파이썬 및 주피터 프로젝트 대시보드</h1>
    <p>GitHub Pages 홈페이지에서 파일들을 직접 열거나 실행할 수 있습니다.</p>

    <ul class="file-list">
        
        <!-- 1. 주피터 노트북 파일 예시 (01_소개.ipynb) -->
        <li class="file-item">
            <div>
                <span class="file-name">📓 01_소개테스트지.ipynb</span>
                <p style="margin: 5px 0 0 0; font-size: 13px; color:#6a737d;">선형회귀 주소 설정 수식 이론 및 시각화 실습 노트북</p>
            </div>
            <div class="btn-group">
                <!-- 상대 경로를 사용해 내 웹사이트 내부에서 파일을 바로 엽니다 -->
                <a href="https://github.com/bahn28/potato/blob/main/_____________test.ipynb" target="_blank" class="btn-view">파일 열기</a>
                
                <!-- 구글 코랩으로 바로 쏘아주는 공식 인터페이스 주소 (상대경로 활용 불가로 풀 주소 입력 필요) -->
                <a href="https://google.com" target="_blank" class="btn-colab">Colab 실행</a>
            </div>
        </li>

        <!-- 2. 일반 파이썬 파일 예시 (cs_nns_gndr_hgt.csv 또는 다른 .py 파일이 있다면) -->
        <li class="file-item">
            <div>
                <span class="file-name">📊 cs_nns_gndr_hgt.csv</span>
                <p style="margin: 5px 0 0 0; font-size: 13px; color:#6a737d;">분석에 사용되는 데이터 세트 파일</p>
            </div>
            <div class="btn-group">
                <!-- 웹 브라우저에서 생짜 데이터를 확인하거나 다운로드 -->
                <a href="./cs_nns_gndr_hgt.csv" target="_blank" class="btn-view">데이터 보기</a>
            </div>
        </li>

    </ul>
</div>

</body>
</html>
